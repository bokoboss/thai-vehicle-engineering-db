<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vehicle Engineering Database{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/vehicles">Vehicle Engineering Database <span>TH</span></a>
        <nav aria-label="Primary navigation">
          <a class="nav-link{% if request.url.path == '/vehicles' or request.url.path.startswith('/vehicles/') %} is-active{% endif %}" href="/vehicles"{% if request.url.path == '/vehicles' or request.url.path.startswith('/vehicles/') %} aria-current="page"{% endif %}>Vehicles</a>
          <a class="nav-link{% if request.url.path == '/compare' %} is-active{% endif %}" href="/compare"{% if request.url.path == '/compare' %} aria-current="page"{% endif %}>Compare</a>
          <a class="nav-link{% if request.url.path == '/design-check' %} is-active{% endif %}" href="/design-check"{% if request.url.path == '/design-check' %} aria-current="page"{% endif %}>Design Check</a>
          <a class="nav-link{% if request.url.path == '/issues' %} is-active{% endif %}" href="/issues"{% if request.url.path == '/issues' %} aria-current="page"{% endif %}>Data Issues</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="shell footer">Evidence first · Unknown is a valid engineering result.</footer>
  </body>
</html>
